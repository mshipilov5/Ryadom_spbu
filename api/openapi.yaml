openapi: 3.0.3
info:
  title: "Рядом — API"
  version: 1.0.0
  description: |
    API главной страницы, каталога статей, локальных аккаунтов и публикаций.
    Публичный каталог доступен гостю и возвращает опубликованные статьи.
servers:
  - url: https://api.example.org
    description: Production example
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Home
    description: Рекомендация и карточки главной страницы
  - name: Psychoeducation
    description: Каталог, авторские статьи и клиническое рецензирование
  - name: Auth
    description: Вход в существующий аккаунт, сессии и управление ролями
  - name: Wall
    description: Анонимные записи стены и их модерация
  - name: Events
    description: Назначенные встречи и управление участием
  - name: Practices
    description: Публичный каталог практик самопомощи
paths:
  /api/v1/home:
    get:
      tags: [Home]
      summary: Получить подборку главной страницы
      operationId: getHomeFeed
      security: []
      responses:
        '200':
          description: Рекомендация и доступные карточки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeFeed'
              example:
                message: Начните с небольшого шага
                event: null
                practice:
                  title: Пауза на 2 минуты
                  description: Короткое упражнение
                  href: /practices

  /api/v1/psychoeducation/materials:
    get:
      tags: [Psychoeducation]
      summary: Получить каталог опубликованных материалов
      description: |
        Возвращает опубликованные психопросветительные материалы. В MVP API
        возвращает только статьи. Неизвестные значения category или tags
        дают успешный ответ с пустым списком.
        Материалы возвращаются в стабильном порядке публикации: новые сначала.
      operationId: listPsychoeducationMaterials
      security: []
      parameters:
        - name: q
          in: query
          description: |
            Поисковая строка по заголовку и краткому описанию.
            Поиск выполняется без учёта регистра. Пробелы по краям игнорируются.
            После trim пустая строка эквивалентна отсутствию параметра.
          required: false
          schema:
            type: string
            maxLength: 100
          example: стресс
        - name: category
          in: query
          description: Slug категории
          required: false
          schema:
            $ref: '#/components/schemas/Slug'
          example: study
        - name: type
          in: query
          description: |
            Тип материала. В MVP доступен только `article`; `audio` и `video`
            зарезервированы для последующих релизов.
          required: false
          schema:
            $ref: '#/components/schemas/ContentType'
          example: article
        - name: tags
          in: query
          description: |
            Slug тегов. При передаче нескольких тегов материал должен
            содержать все указанные теги.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Slug'
          example: [stress, exams]
      responses:
        '200':
          description: Список опубликованных статей; список может быть пустым
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialList'
              examples:
                result:
                  summary: Одна статья по фильтрам
                  value:
                    items:
                      - slug: exam-stress
                        title: Как пережить экзаменационный стресс
                        summary: Несколько безопасных способов снизить напряжение.
                        imageUrl: null
                        category:
                          slug: study
                          name: Учёба
                        tags:
                          - slug: stress
                            name: Стресс
                          - slug: exams
                            name: Экзамены
                        type: article
                        durationMinutes: 5
                        contentWarning: null
                    total: 1
                empty:
                  summary: Поиск не дал результатов
                  value:
                    items: []
                    total: 0
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/psychoeducation/materials/{slug}:
    get:
      tags: [Psychoeducation]
      summary: Получить опубликованный материал
      description: |
        Возвращает полный опубликованный материал. Черновик и отсутствующий
        материал одинаково возвращают 404, чтобы не раскрывать существование черновика.
      operationId: getPsychoeducationMaterial
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: Стабильный публичный идентификатор материала
          schema:
            $ref: '#/components/schemas/Slug'
          example: exam-stress
      responses:
        '200':
          description: Опубликованный материал
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialDetail'
              example:
                slug: exam-stress
                title: Как пережить экзаменационный стресс
                summary: Несколько безопасных способов снизить напряжение.
                imageUrl: null
                category:
                  slug: study
                  name: Учёба
                tags:
                  - slug: stress
                    name: Стресс
                  - slug: exams
                    name: Экзамены
                type: article
                durationMinutes: 5
                contentWarning: null
                body: |
                  Экзаменационный стресс — распространённая реакция на высокую нагрузку.
                  Начните с небольшого следующего шага: сделайте короткий перерыв.
                sources:
                  - title: Всемирная организация здравоохранения — управление стрессом
                    url: https://www.who.int/
                author: Редакция «Рядом»
                reviewer: Клинический рецензент СПбГУ
                reviewedAt: '2026-10-23T00:00:00Z'
        '404':
          $ref: '#/components/responses/MaterialNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/psychoeducation/filters:
    get:
      tags: [Psychoeducation]
      summary: Получить доступные фильтры каталога
      description: Возвращает типы, категории и теги, доступные в публичном каталоге.
      operationId: getPsychoeducationFilters
      security: []
      responses:
        '200':
          description: Набор фильтров каталога
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterOptions'
              example:
                types:
                  - article
                categories:
                  - slug: emotional-state
                    name: Эмоциональное состояние
                  - slug: study
                    name: Учёба
                tags:
                  - slug: stress
                    name: Стресс
                  - slug: sleep
                    name: Сон
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/session:
    get:
      tags: [Auth]
      summary: Получить текущего пользователя
      operationId: getAuthSession
      security:
        - {}
        - SessionCookie: []
      responses:
        '200':
          description: Текущий пользователь или null для гостя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Auth]
      summary: Войти в локальный аккаунт
      description: До 60 попыток в минуту для одного источника запросов.
      operationId: createAuthSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentials'
      responses:
        '200':
          $ref: '#/components/responses/AuthSignedIn'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Неверный логин или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '415':
          $ref: '#/components/responses/JSONRequired'
        '429':
          $ref: '#/components/responses/AuthRateLimit'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Auth]
      summary: Завершить текущую сессию
      operationId: deleteAuthSession
      security:
        - {}
        - SessionCookie: []
      responses:
        '200':
          description: Сессия завершена, пользователь отсутствует
          headers:
            Set-Cookie:
              description: Браузер удаляет cookie ryadom_session.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              example:
                user: null
        '403':
          $ref: '#/components/responses/AccessDenied'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users:
    get:
      tags: [Auth]
      summary: Получить список пользователей
      description: Доступно только с ролью admin.
      operationId: listUsers
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Auth]
      summary: Заменить роли пользователя
      description: |
        Доступно только с ролью admin. Для первого администратора,
        созданного при запуске, роль admin обязательна.
      operationId: updateUserRoles
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRolesRequest'
      responses:
        '200':
          description: Пользователь с обновлёнными ролями
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          $ref: '#/components/responses/JSONRequired'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/psychoeducation/articles:
    get:
      tags: [Psychoeducation]
      summary: Получить свои статьи или очередь рецензирования
      description: |
        view=mine возвращает собственные статьи пользователя с ролью consultant.
        view=queue возвращает статьи, ожидающие решения reviewer.
      operationId: listAuthoredArticles
      security:
        - SessionCookie: []
      parameters:
        - name: view
          in: query
          schema:
            type: string
            enum: [mine, queue]
      responses:
        '200':
          description: Статьи для работы автора или рецензента
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArticleSubmission'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Psychoeducation]
      summary: Отправить статью на клиническую проверку
      description: Доступно с ролью consultant.
      operationId: createAuthoredArticle
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleContent'
      responses:
        '201':
          $ref: '#/components/responses/SubmissionCreated'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '415':
          $ref: '#/components/responses/JSONRequired'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/psychoeducation/articles/{id}:
    parameters:
      - $ref: '#/components/parameters/SubmissionID'
    patch:
      tags: [Psychoeducation]
      summary: Отредактировать свою статью или принять решение при рецензировании
      description: |
        consultant может изменить собственную статью, передав title и body.
        После правки статья возвращается на проверку и скрывается из каталога.
        reviewer передаёт status. Рецензент не может одобрить собственную статью.
        Одобренная статья появляется в публичном каталоге.
        Если клиент передаёт revision из очереди, сервер проверяет, что версия
        не изменилась. При ответе 409 обновите очередь и прочитайте новую версию
        перед повторным решением.
      operationId: updateAuthoredArticle
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - allOf:
                    - $ref: '#/components/schemas/ReviewDecision'
                    - type: object
                      properties:
                        revision:
                          $ref: '#/components/schemas/SubmissionRevision'
                - $ref: '#/components/schemas/ArticleContent'
      responses:
        '200':
          $ref: '#/components/responses/SubmissionChanged'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/SubmissionNotFound'
        '409':
          description: Переданная версия статьи устарела
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: stale_revision
                message: Статья изменилась. Откройте новую версию и проверьте её
        '415':
          $ref: '#/components/responses/JSONRequired'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Psychoeducation]
      summary: Удалить собственную статью
      description: Доступно автору статьи с ролью consultant.
      operationId: deleteAuthoredArticle
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Статья удалена
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
                    enum: [true]
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/SubmissionNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/wall:
    get:
      tags: [Wall]
      summary: Получить записи стены или очередь модерации
      description: |
        Без view или с view=public возвращаются одобренные анонимные записи.
        view=queue показывает записи на проверке пользователю с ролью moderator.
      operationId: listWallPosts
      security:
        - {}
        - SessionCookie: []
      parameters:
        - name: view
          in: query
          schema:
            type: string
            enum: [public, queue]
      responses:
        '200':
          description: Публичные записи или очередь модерации
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      anyOf:
                        - $ref: '#/components/schemas/WallQueueItem'
                        - $ref: '#/components/schemas/PublicWallPost'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Wall]
      summary: Отправить запись на модерацию
      description: Доступно с ролью student.
      operationId: createWallPost
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 5000
                title:
                  type: string
                  description: Для записи стены не используется.
      responses:
        '201':
          $ref: '#/components/responses/SubmissionCreated'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '415':
          $ref: '#/components/responses/JSONRequired'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/wall/{id}:
    parameters:
      - $ref: '#/components/parameters/SubmissionID'
    patch:
      tags: [Wall]
      summary: Одобрить или отклонить запись стены
      description: Доступно с ролью moderator.
      operationId: reviewWallPost
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecision'
      responses:
        '200':
          $ref: '#/components/responses/SubmissionChanged'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/SubmissionNotFound'
        '415':
          $ref: '#/components/responses/JSONRequired'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/events:
    get:
      tags: [Events]
      summary: Получить свои встречи
      description: |
        scope=assigned возвращает встречи, назначенные текущему студенту,
        без списка других участников. scope=created возвращает только встречи,
        созданные текущим консультантом или психологом, со списками участников.
        Если scope пуст, для консультанта или психолога выбирается created,
        для студента — assigned. Список сортируется по дате и времени.
      operationId: listEvents
      security:
        - SessionCookie: []
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [assigned, created]
      responses:
        '200':
          description: Встречи и выбранный scope
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [events, scope]
                    properties:
                      scope:
                        type: string
                        enum: [assigned]
                      events:
                        type: array
                        items:
                          $ref: '#/components/schemas/AssignedEvent'
                  - type: object
                    required: [events, scope]
                    properties:
                      scope:
                        type: string
                        enum: [created]
                      events:
                        type: array
                        items:
                          $ref: '#/components/schemas/CreatedEvent'
        '400':
          description: Неизвестное значение scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '503':
          $ref: '#/components/responses/EventStorageUnavailable'
    post:
      tags: [Events]
      summary: Назначить встречу студентам
      description: Доступно консультанту или психологу. Дата и время задаются по Москве.
      operationId: createEvent
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Встреча создана
          content:
            application/json:
              schema:
                type: object
                required: [event]
                properties:
                  event:
                    $ref: '#/components/schemas/CreatedEvent'
        '400':
          description: Неверные поля, время в прошлом или отсутствует роль студента у участника
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventError'
              example:
                error: past_meeting
                code: past_meeting
                message: Укажите будущие дату и время по Москве
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '415':
          $ref: '#/components/responses/JSONRequired'
        '503':
          $ref: '#/components/responses/EventStorageUnavailable'

  /api/v1/events/students:
    get:
      tags: [Events]
      summary: Получить список студентов для назначения встречи
      description: Доступно консультанту или психологу.
      operationId: listEventStudents
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Аккаунты с текущей ролью student
          content:
            application/json:
              schema:
                type: object
                required: [students]
                properties:
                  students:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventUser'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '503':
          $ref: '#/components/responses/EventStorageUnavailable'

  /api/v1/events/{id}:
    delete:
      tags: [Events]
      summary: Удалить свою встречу или отменить своё участие
      description: |
        Организатор с ролью консультанта или психолога удаляет свою встречу
        для всех участников. Студент отменяет только собственное участие.
      operationId: deleteEventOrCancelAttendance
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Встреча удалена или участие отменено
          content:
            application/json:
              schema:
                type: object
                required: [action]
                properties:
                  action:
                    type: string
                    enum: [deleted, unassigned]
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          description: Встреча не найдена или недоступна текущему пользователю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventError'
        '503':
          $ref: '#/components/responses/EventStorageUnavailable'
  /api/v1/practices:
    get:
      tags: [Practices]
      summary: Получить каталог практик
      description: |
        Возвращает опубликованные практики. Поиск (q) выполняется без учёта
        регистра по заголовку, краткому описанию и тегам. Пробелы по краям
        игнорируются; после trim пустая строка эквивалентна отсутствию параметра.
        Практики возвращаются в стабильном порядке.
      operationId: listPractices
      security: []
      parameters:
        - name: q
          in: query
          description: Поисковая строка по заголовку, краткому описанию и тегам.
          required: false
          schema:
            type: string
            maxLength: 100
          example: дыхание
        - name: kind
          in: query
          description: |
            Тип практики. Значение должно входить в enum PracticeKind;
            иначе возвращается 400 invalid_query.
          required: false
          schema:
            $ref: '#/components/schemas/PracticeKind'
          example: breathing
      responses:
        '200':
          description: Список практик; список может быть пустым
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeList'
              examples:
                result:
                  summary: Одна практика по фильтрам
                  value:
                    items:
                      - slug: long-exhale
                        kind: breathing
                        title: Спокойный длинный выдох
                        summary: Короткая дыхательная практика без задержки дыхания.
                        durationMinutes: 3
                        tags: [напряжение, пауза, дыхание]
                    total: 1
                empty:
                  summary: Поиск не дал результатов
                  value:
                    items: []
                    total: 0
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/practices/{slug}:
    get:
      tags: [Practices]
      summary: Получить практику по slug
      description: Возвращает полную практику. Если практики нет — возвращается 404.
      operationId: getPractice
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: Стабильный публичный идентификатор практики
          schema:
            $ref: '#/components/schemas/Slug'
          example: long-exhale
      responses:
        '200':
          description: Практика
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeDetail'
              example:
                slug: long-exhale
                kind: breathing
                title: Спокойный длинный выдох
                summary: Короткая дыхательная практика без задержки дыхания.
                durationMinutes: 3
                tags: [напряжение, пауза, дыхание]
                steps:
                  - Сядьте или встаньте так, чтобы положение было устойчивым.
                  - Сделайте обычный спокойный вдох без попытки набрать как можно больше воздуха.
                  - Мягко выдохните немного дольше, чем длился вдох.
                boundaries:
                  - Не задерживайте дыхание и не старайтесь дышать глубже, чем комфортно.
                  - Если появляется головокружение или становится неприятно — остановитесь.
        '404':
          $ref: '#/components/responses/PracticeNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    SubmissionID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: ryadom_session
  schemas:
    HomeFeed:
      type: object
      required: [message, event, practice]
      properties:
        message:
          type: string
        event:
          allOf:
            - $ref: '#/components/schemas/HomeFeedItem'
          description: null, если нет события.
        practice:
          $ref: '#/components/schemas/HomeFeedItem'

    HomeFeedItem:
      type: object
      nullable: true
      required: [title, description, href]
      properties:
        title:
          type: string
        description:
          type: string
        href:
          type: string
          example: /practices

    AuthRole:
      type: string
      description: Назначаемая роль. Гость представлен отсутствием сессии.
      enum: [student, consultant, psychologist, admin, moderator, reviewer]

    AuthUser:
      type: object
      required: [id, username, displayName, roles]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AuthRole'

    AuthSession:
      type: object
      required: [user]
      properties:
        user:
          anyOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: object
              nullable: true
              enum: [null]

    AuthUserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'

    AuthCredentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          description: При проверке логина пробелы по краям убираются, регистр игнорируется.
        password:
          type: string
          format: password
          description: Пустой пароль или пароль длиннее 72 байт UTF-8 возвращает 401.

    UpdateUserRolesRequest:
      type: object
      additionalProperties: false
      required: [username, roles]
      properties:
        username:
          type: string
          description: При проверке логина пробелы по краям убираются, регистр игнорируется.
        roles:
          type: array
          maxItems: 6
          description: Полный набор ролей. Пустой массив снимает все назначенные роли.
          items:
            $ref: '#/components/schemas/AuthRole'

    ArticleContent:
      type: object
      required: [title, body]
      not:
        required: [status]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        body:
          type: string
          minLength: 1
          maxLength: 5000

    ReviewDecision:
      type: object
      required: [status]
      not:
        anyOf:
          - required: [title]
          - required: [body]
      properties:
        status:
          type: string
          enum: [approved, rejected]

    SubmissionRevision:
      type: integer
      format: int32
      minimum: 1
      maximum: 2147483647
      description: Версия статьи в очереди. Первая версия равна 1.
      example: 1

    SubmissionState:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, approved, rejected]

    PublicWallPost:
      type: object
      required: [id, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
        createdAt:
          type: string
          format: date-time

    WallQueueItem:
      allOf:
        - $ref: '#/components/schemas/SubmissionState'
        - $ref: '#/components/schemas/PublicWallPost'
        - type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [wall]

    ArticleSubmission:
      allOf:
        - $ref: '#/components/schemas/SubmissionState'
        - $ref: '#/components/schemas/PublicWallPost'
        - type: object
          required: [kind, title, authorId, authorName]
          properties:
            kind:
              type: string
              enum: [article]
            title:
              type: string
            authorId:
              type: string
            authorName:
              type: string
            revision:
              allOf:
                - $ref: '#/components/schemas/SubmissionRevision'
              description: Возвращается в очереди статей для рецензента.

    EventUser:
      type: object
      required: [id, username, displayName]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string

    EventDate:
      type: string
      format: date
      description: Календарная дата по Москве с 2020 по 2100 год.

    EventTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: Время в формате HH:mm по Москве.

    EventBase:
      type: object
      required: [id, title, date, time, address, organizer, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        date:
          $ref: '#/components/schemas/EventDate'
        time:
          $ref: '#/components/schemas/EventTime'
        address:
          type: string
        organizer:
          $ref: '#/components/schemas/EventUser'
        createdAt:
          type: string
          format: date-time

    AssignedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          not:
            required: [participants]

    CreatedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [participants]
          properties:
            participants:
              type: array
              items:
                $ref: '#/components/schemas/EventUser'

    CreateEventRequest:
      type: object
      additionalProperties: false
      required: [title, date, time, address, studentIds]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        date:
          $ref: '#/components/schemas/EventDate'
        time:
          $ref: '#/components/schemas/EventTime'
        address:
          type: string
          minLength: 1
          maxLength: 300
        studentIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            pattern: '^[1-9][0-9]{0,18}$'

    EventError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          required: [error]
          properties:
            error:
              type: string
              description: Код ошибки для клиента событий.

    MaterialList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MaterialPreview'
        total:
          type: integer
          minimum: 0
          description: Число результатов с учётом выбранных фильтров

    MaterialPreview:
      type: object
      required:
        - slug
        - title
        - summary
        - imageUrl
        - category
        - tags
        - type
        - durationMinutes
        - contentWarning
      properties:
        slug:
          type: string
          example: exam-stress
        title:
          type: string
          maxLength: 180
        summary:
          type: string
          maxLength: 500
        imageUrl:
          type: string
          format: uri
          nullable: true
        type:
          $ref: '#/components/schemas/ContentType'
        category:
          $ref: '#/components/schemas/MaterialCategory'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/MaterialTag'
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 120
          description: |
            Ожидаемая длительность в минутах. Frontend отображает её как
            время чтения, прослушивания или просмотра в зависимости от type.
        contentWarning:
          type: string
          maxLength: 500
          nullable: true

    MaterialDetail:
      allOf:
        - $ref: '#/components/schemas/MaterialPreview'
        - type: object
          required: [body, sources, author, reviewer, reviewedAt]
          properties:
            body:
              type: string
              description: Полный текст статьи в Markdown (CommonMark)
            sources:
              type: array
              items:
                $ref: '#/components/schemas/Source'
            author:
              type: string
              maxLength: 180
              description: Публичное имя автора или редакционное указание материала.
              example: Редакция «Рядом»
            reviewer:
              type: string
              maxLength: 180
              description: Публичное указание на клинического рецензента материала.
              example: Клинический рецензент СПбГУ
            reviewedAt:
              type: string
              format: date-time

    ContentType:
      type: string
      description: В MVP доступен только тип article.
      enum: [article]

    Slug:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'

    MaterialCategory:
      type: object
      required: [slug, name]
      properties:
        slug:
          allOf:
            - $ref: '#/components/schemas/Slug'
          example: study
        name:
          type: string
          example: Учёба

    MaterialTag:
      type: object
      required: [slug, name]
      description: Тема материала; тег не описывает и не классифицирует пользователя.
      properties:
        slug:
          allOf:
            - $ref: '#/components/schemas/Slug'
          example: stress
        name:
          type: string
          example: Стресс

    Source:
      type: object
      required: [title, url]
      properties:
        title:
          type: string
        url:
          type: string
          format: uri

    FilterOptions:
      type: object
      required: [types, categories, tags]
      properties:
        types:
          type: array
          description: Frontend скрывает фильтр по типу, если доступен только один тип.
          items:
            $ref: '#/components/schemas/ContentType'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/MaterialCategory'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/MaterialTag'

    PracticeKind:
      type: string
      description: |
        Тип практики. Frontend группирует и подписывает практики по этому значению.
      enum: [breathing, grounding, stress, mindfulness, checklist]

    PracticeList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PracticePreview'
        total:
          type: integer
          minimum: 0
          description: Число результатов с учётом выбранных фильтров

    PracticePreview:
      type: object
      required: [slug, kind, title, summary, durationMinutes, tags]
      properties:
        slug:
          allOf:
            - $ref: '#/components/schemas/Slug'
          example: long-exhale
        kind:
          $ref: '#/components/schemas/PracticeKind'
        title:
          type: string
          maxLength: 180
        summary:
          type: string
          maxLength: 500
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 120
          description: Ожидаемая длительность практики в минутах.
        tags:
          type: array
          description: Темы практики в виде простых подписей (не slug).
          items:
            type: string
            example: дыхание

    PracticeDetail:
      allOf:
        - $ref: '#/components/schemas/PracticePreview'
        - type: object
          required: [steps, boundaries]
          properties:
            steps:
              type: array
              description: Шаги выполнения практики по порядку.
              items:
                type: string
            boundaries:
              type: array
              description: Ограничения и предупреждения, которые стоит показать перед началом.
              items:
                type: string

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: invalid_query
        message:
          type: string
          example: Параметр q имеет недопустимое значение
        requestId:
          type: string
          nullable: true

  responses:
    EventStorageUnavailable:
      description: Хранилище событий временно недоступно
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EventError'

    AuthSignedIn:
      description: Пользователь вошёл, сессия действует 8 часов
      headers:
        Set-Cookie:
          description: Cookie ryadom_session с HttpOnly и SameSite=Lax. Флаг Secure включён по умолчанию.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthUserResponse'
    AuthRateLimit:
      description: Превышен лимит попыток входа
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthenticationRequired:
      description: Требуется действующая сессия
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AccessDenied:
      description: Недостаточно прав либо источник запроса не разрешён
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    SubmissionCreated:
      description: Запись создана и ожидает проверки
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SubmissionState'
    SubmissionChanged:
      description: Запись изменена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SubmissionState'
    SubmissionNotFound:
      description: Подходящая запись не найдена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    JSONRequired:
      description: Тело запроса должно иметь Content-Type application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InvalidRequest:
      description: Некорректные параметры или тело запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InvalidQuery:
      description: Некорректный параметр поиска или фильтра
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: invalid_query
            message: Параметр q не должен быть длиннее 100 символов
    PracticeNotFound:
      description: Практика не существует либо не опубликована
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: practice_not_found
            message: Практика не найдена
    MaterialNotFound:
      description: Статья не существует либо не опубликована
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: material_not_found
            message: Материал не найден
    InternalError:
      description: Внутренняя ошибка сервиса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: internal_error
            message: Не удалось обработать запрос. Повторите попытку позже.
